<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Glance">
  <title>Logger Glance</title>
  <link rel="manifest" href="glance.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <style>
    :root { --bg: #0b1020; --card: #151b33; --ink: #f4f6ff; --mute: #8e98bd; --green: #34d399; --red: #fb7185; --amber: #fbbf24; --blue: #60a5fa; }
    @media (prefers-color-scheme: light) { :root { --bg: #eef1fb; --card: #fff; --ink: #121830; --mute: #5d6788; --green: #059669; --red: #e11d48; --amber: #b45309; --blue: #2563eb; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font: 16px/1.35 -apple-system, system-ui, "Segoe UI", sans-serif;
      padding: max(18px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom)); }
    main { max-width: 460px; margin: 0 auto; }
    .top { display: flex; justify-content: space-between; align-items: baseline; color: var(--mute); font-size: 13px; margin-bottom: 10px; }
    .hero { background: linear-gradient(135deg, #1e1b4b, #2b3a8f 55%, #0e8f8a); color: #fff; border-radius: 22px; padding: 20px 20px 18px; }
    .hero .k { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; opacity: .8; }
    .hero .v { font-size: 44px; font-weight: 750; letter-spacing: -.02em; margin: 2px 0; }
    .hero .s { font-size: 13px; opacity: .85; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .tile { background: var(--card); border-radius: 18px; padding: 14px 16px; }
    .tile .k { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--mute); }
    .tile .v { font-size: 25px; font-weight: 700; margin-top: 3px; }
    .tile .s { font-size: 12px; color: var(--mute); margin-top: 2px; }
    .wide { grid-column: 1 / -1; }
    .pos { color: var(--green); } .neg { color: var(--red); } .warn { color: var(--amber); }
    a.open { display: block; text-align: center; margin-top: 16px; color: var(--blue); text-decoration: none; font-weight: 600; }
    .msg { text-align: center; color: var(--mute); margin-top: 40px; }
  </style>
</head>
<body>
  <main id="app"><div class="msg">Loading…</div></main>
  <script type="module" src="js/glance.js"></script>
</body>
</html>
